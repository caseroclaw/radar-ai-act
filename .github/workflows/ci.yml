name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir el HTML estático
        run: npm run build
      - name: El HTML generado debe coincidir con el commiteado
        run: git diff --exit-code -- index.html
      - name: Pruebas
        run: npm test
      - name: Auditoría de la página
        run: npm run check
